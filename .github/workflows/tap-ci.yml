name: tap-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TAP: goran-arsov/freshjots

jobs:
  formula:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Tap this checkout
        run: brew tap "$TAP" "$GITHUB_WORKSPACE"

      - name: brew style
        run: brew style "$TAP/freshjots"

      - name: brew audit
        run: brew audit --strict --online "$TAP/freshjots"

      - name: brew install
        run: brew install "$TAP/freshjots"

      - name: brew test
        run: brew test "$TAP/freshjots"
