name: tap-ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily — catches drift between the formula and the live freshjots.com
    # URLs (binary at /cli/<version>/freshjots, manifest at latest-version.txt)
    # without waiting for someone to push.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORMULA: goran-arsov/freshjots/freshjots

jobs:
  formula:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      # Homebrew's Linux build sandbox needs a rootless bwrap on PATH
      # before `brew install` will run; the runner image doesn't ship one.
      - name: Install Bubblewrap for the Homebrew Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: brew style
        run: brew style "$FORMULA"

      - name: brew audit
        run: brew audit --strict --online "$FORMULA"

      - name: brew install
        run: brew install "$FORMULA"

      - name: brew test
        run: brew test "$FORMULA"
