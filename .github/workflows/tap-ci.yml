name: tap-ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily — catches drift between the formula and the live freshjots.com
    # URLs (binary at /cli/<version>/freshjots, manifest at latest-version.txt)
    # without waiting for someone to push.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORMULA: goran-arsov/freshjots/freshjots

jobs:
  formula:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      # Homebrew's Linux build sandbox needs a rootless bwrap on PATH and
      # unprivileged user namespaces enabled; the runner image ships neither.
      # The sysctls are the ones Homebrew's own error message prescribes
      # (|| true: not every kernel exposes all three knobs).
      - name: Install Bubblewrap for the Homebrew Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w user.max_user_namespaces=28633 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: brew style
        run: brew style "$FORMULA"

      - name: brew audit
        run: brew audit --strict --online "$FORMULA"

      - name: brew install
        run: brew install "$FORMULA"

      - name: brew test
        run: brew test "$FORMULA"
